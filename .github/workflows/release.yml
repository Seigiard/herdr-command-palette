name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package plugin
        run: |
          archive="herdr-command-palette-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" README.md LICENSE herdr-plugin.toml *.py
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes herdr-command-palette-*.tar.gz*
