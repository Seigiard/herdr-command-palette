[[commands]]
group = "Examples"
title = "Inspect current directory"
shortcuts = ["inspect", "инспекция"]
description = "List the target directory without changing it"
type = "shell"
command = "ls -la {target_cwd_q}"

[[commands]]
group = "Workspaces"
title = "Switch workspace"
description = "Choose and focus a workspace"
type = "workspace_picker"

[[commands]]
group = "Editor"
title = "Open in editor"
description = "Open the target directory with $EDITOR"
type = "tab_run"
label = "editor"
command = "${EDITOR:-vi} {target_cwd_q}"

[[commands]]
group = "Herdr"
title = "Reload config"
description = "Apply config.toml changes without restarting panes"
type = "herdr"
args = ["server", "reload-config"]

[[commands]]
group = "Settings"
title = "Edit command palette config"
description = "Open commands.toml in a new tab with $EDITOR"
type = "tab_run"
label = "commands.toml"
command = "${EDITOR:-vi} {config_file_q}"
